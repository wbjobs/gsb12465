<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共享剪贴板队列</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>共享剪贴板队列</h1>
    <div class="header-info">
      <span id="tab-name" class="badge"></span>
      <span id="stats" class="stats"></span>
    </div>
  </header>

  <main>
    <section class="panel queue-panel">
      <div class="toolbar">
        <input id="add-input" type="text" placeholder="手动输入文本，回车加入队列">
        <button id="add-btn">加入</button>
        <button id="read-clip-btn" title="从系统剪贴板读取文本加入队列">读取剪贴板</button>
        <button id="take-next-btn" title="取出最新的未固定条目并复制">取出队首</button>
        <button id="dedup-btn" title="去除队列中的重复文本">去重</button>
        <button id="clear-btn" class="danger">清空</button>
      </div>
      <div class="toolbar secondary">
        <input id="search-input" type="search" placeholder="搜索队列内容…">
        <label class="toggle">
          <input id="dedup-toggle" type="checkbox" checked>
          自动跳过重复
        </label>
      </div>
      <ul id="queue-list" class="queue-list"></ul>
    </section>

    <aside class="sidebar">
      <section class="panel">
        <h2>在线标签页</h2>
        <ul id="peers-list" class="peers-list"></ul>
      </section>
      <section class="panel ops-panel">
        <h2>操作记录</h2>
        <select id="tab-filter" aria-label="按标签页筛选"></select>
        <ul id="ops-list" class="ops-list"></ul>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
